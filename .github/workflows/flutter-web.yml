name: Flutter web cleanroom CI
on:
  push:
    branches: [cleanroom-rebuild]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=web .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
