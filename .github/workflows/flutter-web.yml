name: Flutter web pilot CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5
      - run: flutter create --platforms=web --project-name microlearning_hub --no-pub .
      - run: flutter pub get
      - name: Capture resolved dependency lock for reproducible release
        run: cat pubspec.lock
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-web-${{ github.sha }}
          path: |
            pubspec.lock
            build/web
          retention-days: 3
